name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sls
        uses: actions/checkout@v4
        with:
          path: sls

      - name: Checkout zpm (path dependency)
        uses: actions/checkout@v4
        with:
          repository: SB0LTD/zpm
          path: zpm

      - name: Install latest Sig
        run: |
          set -euo pipefail
          URL="https://github.com/SB0LTD/sig/releases/latest/download/sig-x86_64-linux.tar.xz"
          echo "Downloading $URL"
          curl -fSL "$URL" -o sig.tar.xz
          mkdir -p sig-dist
          tar -xf sig.tar.xz -C sig-dist
          SIG_BIN="$(find "$PWD/sig-dist" -type f -name sig | head -n1)"
          if [ -z "$SIG_BIN" ]; then echo "sig binary not found"; exit 1; fi
          chmod +x "$SIG_BIN"
          echo "$(dirname "$SIG_BIN")" >> "$GITHUB_PATH"
          "$SIG_BIN" version

      - name: Build (native)
        working-directory: sls
        run: |
          set -euo pipefail
          sig build

      - name: Test (native)
        working-directory: sls
        run: |
          set -euo pipefail
          sig build test

      - name: Cross-compile all release targets
        working-directory: sls
        run: |
          set -euo pipefail
          for triple in \
            x86_64-linux-gnu aarch64-linux-gnu \
            x86_64-macos aarch64-macos \
            x86_64-windows aarch64-windows; do
            echo "::group::$triple"
            rm -rf sig-out
            sig build -Dtarget="$triple" -Doptimize=ReleaseFast
            echo "::endgroup::"
          done

      # SB0 native — build the SB0X userspace image and verify its magic.
      - name: SB0 native (SB0X image)
        working-directory: sls
        run: bash scripts/build-sb0.sh sig-out/bin/sls-aarch64-sb0.sb0x
